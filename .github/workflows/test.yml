name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify imports
        run: |
          python -c "import crewai; print('CrewAI OK')"
          python -c "import langchain_nti; print('NTI wrapper OK')"
          python -c "from tools import execute_transfer; print('Tools OK')"
